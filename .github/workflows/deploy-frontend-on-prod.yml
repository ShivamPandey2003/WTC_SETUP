name: Deploy Frontend

on:
  push:
    branches: [main-prod]

jobs:
  display-variables:
    name: ${{ vars.JOB_NAME }}
    runs-on: ubuntu-latest
    environment: ITA WTC PROD AWS
    steps:
    - name: Use variables
      run: |
        echo "api url variable : $VITE_REACT_APP_API_URL"
        echo "cooldown variable : $VITE_REACT_COOLDOWN_TIME_SECONDS"
        echo "variable from shell environment : $env_var"
      env:
        VITE_REACT_APP_API_URL: ${{ vars.VITE_REACT_APP_API_URL }}
        VITE_REACT_COOLDOWN_TIME_SECONDS: ${{ vars.VITE_REACT_COOLDOWN_TIME_SECONDS }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_REACT_APP_API_URL: ${{ vars.VITE_REACT_APP_API_URL }}
          VITE_REACT_COOLDOWN_TIME_SECONDS: ${{ vars.VITE_REACT_COOLDOWN_TIME_SECONDS }}
          VITE_REACT_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_REACT_GOOGLE_MAPS_API_KEY }}
          VITE_REACT_RECAPTCHA: ${{ vars.VITE_REACT_RECAPTCHA }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Sync to S3
        run: aws s3 sync ./dist s3://ita-wtc-conference-frontend --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"